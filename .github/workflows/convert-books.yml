name: Convert Books to AZW3

on:
  push:
    paths:
      - '**/*.pdf'
      - '**/*.epub'
      - '!**/*.azw3'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if PDF or EPUB was added/modified
        id: check_trigger
        run: |
          # Kiểm tra xem có file .pdf hoặc .epub nào thực sự được thêm mới (A) hoặc cập nhật (M) không
          CHANGED=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD 2>/dev/null | grep -iE '\.(pdf|epub)$' || true)
          # Nếu đây là commit đầu tiên thì tìm file trên đĩa
          if [ -z "$CHANGED" ] && [ "$(git rev-list --count HEAD)" -eq 1 ]; then
            CHANGED=$(find . -type f \( -name "*.pdf" -o -name "*.epub" \) ! -path "*/.*" || true)
          fi

          if [ -z "$CHANGED" ]; then
            echo ">>> Commit này chỉ là XÓA file hoặc không có sách mới được thêm. Dừng workflow."
            echo "SHOULD_RUN=false" >> $GITHUB_ENV
          else
            echo ">>> Phát hiện sách mới/sửa đổi:"
            echo "$CHANGED"
            echo "SHOULD_RUN=true" >> $GITHUB_ENV
          fi

      - name: Install Calibre & system tools
        if: env.SHOULD_RUN == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y calibre

      - name: Set up Python
        if: env.SHOULD_RUN == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        if: env.SHOULD_RUN == 'true'
        run: |
          pip install pymupdf ebooklib

      - name: Convert PDF/EPUB to AZW3 and cleanup
        if: env.SHOULD_RUN == 'true'
        run: |
          python -c "
          import os, subprocess, sys
          from pathlib import Path

          targets = []
          for ext in ('*.pdf', '*.epub'):
              for p in Path('.').rglob(ext):
                  if not any(part.startswith('.') for part in p.parts):
                      targets.append(p)

          print(f'Tìm thấy {len(targets)} file cần xử lý.')
          for t in targets:
              print(f'>>> Đang chuyển đổi: {t}')
              res = subprocess.run([sys.executable, 'pdf2epub.py', str(t), '--only-azw3'])
              if res.returncode != 0:
                  print(f'Lỗi khi chuyển đổi {t}', file=sys.stderr)

          if targets:
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write('CONVERTED=1\n')
          "

      - name: Commit and push AZW3 files
        if: env.CONVERTED == '1'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Auto-convert books to AZW3 [skip ci]"
            git push
          else
            echo "Không có thay đổi mới."
          fi
