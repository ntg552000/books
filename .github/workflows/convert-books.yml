name: Convert Books to AZW3

on:
  push:
    paths:
      - '**/*.pdf'
      - '**/*.epub'
      - '!**/*.azw3'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Calibre & system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y calibre

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install pymupdf ebooklib

      - name: Convert PDF/EPUB to AZW3 and cleanup
        run: |
          python -c "
          import os, subprocess, sys
          from pathlib import Path

          targets = []
          for ext in ('*.pdf', '*.epub'):
              for p in Path('.').rglob(ext):
                  if not any(part.startswith('.') for part in p.parts):
                      targets.append(p)

          print(f'Tìm thấy {len(targets)} file cần xử lý.')
          for t in targets:
              print(f'>>> Đang chuyển đổi: {t}')
              res = subprocess.run([sys.executable, 'pdf2epub.py', str(t), '--only-azw3'])
              if res.returncode != 0:
                  print(f'Lỗi khi chuyển đổi {t}', file=sys.stderr)

          if targets:
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write('CONVERTED=1\n')
          "

      - name: Commit and push AZW3 files
        if: env.CONVERTED == '1'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Auto-convert books to AZW3 [skip ci]"
            git push
          else
            echo "Không có thay đổi mới."
          fi
